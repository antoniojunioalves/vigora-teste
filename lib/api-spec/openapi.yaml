          nullable: true
        status:
          type: string
          enum: [ativo, inativo]
        observacoes:
          type: string
          nullable: true
        usuarioId:
          type: integer
          nullable: true
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
      required:
        - id
        - nome
        - numeroWhatsapp
        - status
        - criadoEm
        - atualizadoEm

    CreateContatoWhatsappRequest:
      type: object
      properties:
        nome:
          type: string
        numeroWhatsapp:
          type: string
        email:
          type: string
          nullable: true
        status:
          type: string
          enum: [ativo, inativo]
        observacoes:
          type: string
          nullable: true
      required:
        - nome
        - numeroWhatsapp

    ProcessoComContatos:
      allOf:
        - $ref: "#/components/schemas/Processo"
        - type: object
          properties:
